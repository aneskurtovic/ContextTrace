name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# This workflow only needs to read source and dependency metadata.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.toolchain }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep the declared 1.88 MSRV honest while the stable lane supplies the
        # formatter, lint and release-build gate used by contributors.
        toolchain: [stable, 1.88.0]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master branch, 2026-08-05
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-${{ matrix.toolchain }}

      - name: Check formatting
        if: matrix.toolchain == 'stable'
        run: cargo +stable fmt --all -- --check

      - name: Lint workspace
        if: matrix.toolchain == 'stable'
        run: cargo +stable clippy --workspace --all-targets -- -D warnings

      - name: Test workspace
        # `rust-toolchain.toml` selects stable, so use Cargo's explicit
        # toolchain syntax to make the minimum-version lane real.
        run: cargo +${{ matrix.toolchain }} test --workspace --all-targets

      - name: Build release workspace
        if: matrix.toolchain == 'stable'
        run: cargo +stable build --workspace --release

  frontend:
    name: Frontend
    runs-on: windows-latest
    defaults:
      run:
        working-directory: crates/ct-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/ct-ui/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

  desktop:
    name: Desktop (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: crates/ct-ui
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/ct-ui/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      # Bundling/signing belongs to the release workflow. This still executes
      # Tauri's production frontend build and compiles the Windows desktop app.
      - name: Compile Tauri desktop app
        run: .\node_modules\.bin\tauri.cmd build --no-bundle

  cli-smoke:
    name: CLI fixture smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-stable

      - name: Arrange committed synthetic sessions
        shell: pwsh
        run: |
          $fixtureRoot = Join-Path $env:RUNNER_TEMP 'contexttrace-fixtures'
          $codexSessions = Join-Path $fixtureRoot 'codex\sessions\2026\07\29'
          $claudeProjects = Join-Path $fixtureRoot 'claude\projects\ci-fixtures'
          New-Item -ItemType Directory -Force -Path $codexSessions, $claudeProjects | Out-Null
          Copy-Item tests/fixtures/codex/rollout.jsonl (Join-Path $codexSessions 'rollout.jsonl')
          Copy-Item tests/fixtures/claude_code/session.jsonl (Join-Path $claudeProjects 'session.jsonl')
          "CODEX_HOME=$($fixtureRoot)\codex" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CLAUDE_CONFIG_DIR=$($fixtureRoot)\claude" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build release CLI
        run: cargo build --release -p ct-cli

      - name: Discover and inspect fixture sessions
        shell: pwsh
        run: |
          $sessions = & .\target\release\ct.exe sessions --json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (@($sessions).Count -ne 2) { throw "Expected two fixture sessions, found $(@($sessions).Count)." }

          $codex = @($sessions | Where-Object { $_.agent -eq 'codex' })
          $claude = @($sessions | Where-Object { $_.agent -eq 'claude-code' })
          if ($codex.Count -ne 1 -or $claude.Count -ne 1) { throw 'Both fixture agents must be discovered.' }

          $inspection = & .\target\release\ct.exe inspect $codex[0].id --json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($null -eq $inspection) { throw 'Codex fixture inspection produced no JSON.' }

          $context = & .\target\release\ct.exe context $codex[0].id --json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($null -eq $context) { throw 'Codex fixture context analysis produced no JSON.' }

      - name: Assert Codex compaction diff smoke
        shell: pwsh
        run: |
          $sessions = & .\target\release\ct.exe sessions --json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $codex = @($sessions | Where-Object { $_.agent -eq 'codex' })
          if ($codex.Count -ne 1) { throw 'Expected the committed codex fixture for the compaction smoke check.' }

          $compactions = & .\target\release\ct.exe compactions $codex[0].id --json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (@($compactions).Count -lt 1) { throw 'Expected at least one compaction event in the codex fixture.' }

          $available = @($compactions | Where-Object { $_.status -eq 'available' })
          if ($available.Count -lt 1) { throw 'Expected a structurally diffable compaction (replacement_history present).' }

          $dropped = @($available[0].items | Where-Object { $_.disposition.kind -eq 'dropped' })
          if ($dropped.Count -lt 1) { throw 'Expected the compaction to report at least one dropped item.' }

      - name: Arrange dedicated secrets fixture
        shell: pwsh
        run: |
          $secretsRoot = Join-Path $env:RUNNER_TEMP 'contexttrace-secrets-fixture'
          $secretsSessions = Join-Path $secretsRoot 'codex\sessions\2026\07\25'
          New-Item -ItemType Directory -Force -Path $secretsSessions | Out-Null
          Copy-Item tests/fixtures/secrets/codex/rollout.jsonl (Join-Path $secretsSessions 'rollout.jsonl')
          "CONTEXTTRACE_SECRETS_CODEX_HOME=$($secretsRoot)\codex" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # Runs against a session file that lives only under this isolated
      # CODEX_HOME, never under the CODEX_HOME used above, so this cannot be
      # satisfied by the compaction fixture accidentally containing a
      # credential shape too.
      - name: Smoke test secret scanning and redacted export
        shell: pwsh
        env:
          CODEX_HOME: ${{ env.CONTEXTTRACE_SECRETS_CODEX_HOME }}
        run: |
          $sessions = & .\target\release\ct.exe sessions --json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $codexSecrets = @($sessions | Where-Object { $_.agent -eq 'codex' })
          if ($codexSecrets.Count -ne 1) { throw 'Expected exactly the dedicated credential fixture under the isolated CODEX_HOME.' }
          $id = $codexSecrets[0].id

          # Values only this fixture carries. None may survive a redacted
          # export, and `ct secrets` must never print any of them either -- it
          # reports a kind and a location, never the matched text.
          $leakedSecrets = @(
            'sk-proj-abcdefghijklmnopqrstuvwxyz012345',
            'sk-ant-api03-abcdefghijklmnopqrstuvwxyz012345',
            'ghp_abcdefghijklmnopqrstuvwxyz0123456789AB',
            'AKIAIOSFODNN7EXAMPLE',
            'MIIEvQIBADANBgkqhkiG9w0BAQEFAASCBKcwggSjAgEAAoIBAQDemoOnlyFakeKey'
          )

          $secretsOutput = & .\target\release\ct.exe secrets $id
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $secretsText = $secretsOutput -join "`n"
          if ($secretsText -notmatch 'Found (\d+) potential secret occurrence') {
            throw 'Expected ct secrets to report findings against the credential fixture.'
          }
          if ([int]$Matches[1] -le 0) { throw 'Expected a non-zero secret finding count.' }
          foreach ($label in @('OpenAI API key', 'Anthropic API key', 'GitHub token', 'AWS access key id', 'private key')) {
            if ($secretsText -notmatch [regex]::Escape($label)) { throw "Expected a '$label' finding." }
          }
          foreach ($secret in $leakedSecrets) {
            if ($secretsText.Contains($secret)) { throw 'ct secrets must never print a matched credential value.' }
          }

          $exportStderr = Join-Path $env:RUNNER_TEMP 'export-secrets-stderr.txt'
          $exportLines = & .\target\release\ct.exe export $id --redact-secrets 2>$exportStderr
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exportText = $exportLines -join "`n"
          if ($exportText -notmatch '"redaction":"secrets"') {
            throw 'Expected the export header to record that secrets redaction ran.'
          }
          foreach ($secret in $leakedSecrets) {
            if ($exportText.Contains($secret)) { throw 'Redacted export still contains a credential.' }
          }

          $exportStderrText = Get-Content $exportStderr -Raw
          if ($exportStderrText -notmatch 'Redacted (\d+) potential secret occurrence') {
            throw 'Expected a redaction summary on stderr.'
          }
          if ([int]$Matches[1] -le 0) { throw 'Expected the redacted export to have changed at least one field.' }

      # The archive is the one place ContextTrace writes, and it concentrates by
      # construction what was scattered across a home directory. So the same
      # fixture that proves `ct secrets` never prints a credential is used to
      # prove the archive never stores one by default. This asserts on the bytes
      # actually written to disk, not on what the command reported doing.
      - name: Smoke test archiving, redaction on ingest, and verification
        shell: pwsh
        env:
          CODEX_HOME: ${{ env.CONTEXTTRACE_SECRETS_CODEX_HOME }}
        run: |
          $archiveRoot = Join-Path $env:RUNNER_TEMP 'contexttrace-archive'
          $env:CONTEXTTRACE_ARCHIVE = $archiveRoot

          $sessions = & .	argetelease\ct.exe sessions --json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $id = @($sessions | Where-Object { $_.agent -eq 'codex' })[0].id

          $roots = & .	argetelease\ct.exe roots
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (($roots -join "`n") -notmatch [regex]::Escape($archiveRoot)) {
            throw 'ct roots must name the directory ContextTrace writes to.'
          }

          $archived = & .	argetelease\ct.exe archive $id --json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($archived.redaction -ne 'redacted') { throw 'Archiving must redact by default.' }
          if ($archived.redacted_values -le 0) {
            throw 'Expected the credential fixture to have values replaced on ingest.'
          }

          $leakedSecrets = @(
            'sk-proj-abcdefghijklmnopqrstuvwxyz012345',
            'sk-ant-api03-abcdefghijklmnopqrstuvwxyz012345',
            'ghp_abcdefghijklmnopqrstuvwxyz0123456789AB',
            'AKIAIOSFODNN7EXAMPLE',
            'MIIEvQIBADANBgkqhkiG9w0BAQEFAASCBKcwggSjAgEAAoIBAQDemoOnlyFakeKey'
          )
          $stored = Get-ChildItem -Path $archiveRoot -Recurse -File | ForEach-Object {
            Get-Content $_.FullName -Raw
          }
          $storedText = $stored -join "`n"
          if ([string]::IsNullOrEmpty($storedText)) { throw 'The archive wrote nothing.' }
          foreach ($secret in $leakedSecrets) {
            if ($storedText.Contains($secret)) {
              throw 'A credential survived into the archive, including its manifest.'
            }
          }

          # Every archived record must still be a parseable JSON line, or the
          # copy is worse than useless -- redaction substitutes inside raw JSONL.
          $copy = Get-ChildItem -Path (Join-Path $archiveRoot 'sessions') -Recurse -File | Select-Object -First 1
          foreach ($line in (Get-Content $copy.FullName)) {
            if ([string]::IsNullOrWhiteSpace($line)) { continue }
            try { $null = $line | ConvertFrom-Json } catch { throw 'Redaction left an archived record unparseable.' }
          }

          $verify = & .	argetelease\ct.exe archive $id --verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (($verify -join "`n") -notmatch 'intact') { throw 'A freshly archived session must verify as intact.' }

          $list = & .	argetelease\ct.exe archive --json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (@($list).Count -ne 1) { throw 'Expected exactly one archived session.' }
