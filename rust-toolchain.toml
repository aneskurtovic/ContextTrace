[toolchain]
# Use the stable toolchain for the host platform: a host-neutral channel lets
# rustup select the native target rather than pinning one. The previous
# Windows-GNU pin stopped linking when the local LLVM-MinGW installation no
# longer supplied GCC runtime libraries.
#
# Linux is now verified for everything except `ct-ui`: `.woodpecker/rust.yaml`
# formats, lints, tests and MSRV-checks the workspace there on every push. The
# `ct-ui` is validated in the Windows lane; macOS native validation remains
# outstanding. See docs/CI.md and docs/MACOS.md.
channel = "stable"
components = ["rustfmt", "clippy"]
