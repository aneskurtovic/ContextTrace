[toolchain]
# Pinned to the GNU toolchain: this machine has no MSVC "C++ build tools"
# workload installed, so the msvc target cannot link. GNU links out of the box.
#
# Before starting the Tauri desktop shell (milestone 3), install the Visual
# Studio C++ build tools and switch this to stable-x86_64-pc-windows-msvc --
# Tauri/WebView2 on Windows is far better trodden on msvc.
channel = "stable-x86_64-pc-windows-gnu"
components = ["rustfmt", "clippy"]
