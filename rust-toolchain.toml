[toolchain]
# Use the stable toolchain for the host platform: a host-neutral channel lets
# rustup select the native target rather than pinning one. The previous
# Windows-GNU pin stopped linking when the local LLVM-MinGW installation no
# longer supplied GCC runtime libraries. Only Windows is verified: every job
# in `.github/workflows/ci.yml` and `release.yml` runs on `windows-latest`,
# and nothing has built this workspace on macOS or Linux.
channel = "stable"
components = ["rustfmt", "clippy"]
