# Windows release packaging on the trusted Woodpecker runner.
#
# The tag-only workflow runs on the existing self-hosted Windows local agent.
# It creates the signed installer, updater manifest, portable/CLI ZIPs, and
# checksum manifest, waits for every validation workflow on that tag, then
# uploads the verified files and promotes the release to stable on GitHub.

labels:
  platform: windows/amd64
  backend: local

when:
  - event: tag
    ref: refs/tags/v*

depends_on:
  - windows
  - rust
  - frontend

variables:
  - &shell powershell
  - &release_env
    CI: "true"
    CARGO_TERM_COLOR: always
    CARGO_INCREMENTAL: "0"
    CARGO_TARGET_DIR: C:/woodpecker-cache/contexttrace/target
    npm_config_cache: C:/woodpecker-cache/contexttrace/npm
    HOME: C:/woodpecker-cache/contexttrace/home
    USERPROFILE: C:/woodpecker-cache/contexttrace/home
    LOCALAPPDATA: C:/woodpecker-cache/contexttrace/localappdata
    APPDATA: C:/woodpecker-cache/contexttrace/appdata
    TEMP: C:/woodpecker-cache/contexttrace/temp
    TMP: C:/woodpecker-cache/contexttrace/temp
    RUST_BACKTRACE: "1"

steps:
  - name: package-windows
    image: *shell
    environment:
      <<: *release_env
      TAURI_SIGNING_PRIVATE_KEY:
        from_secret: TAURI_SIGNING_PRIVATE_KEY
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
    commands:
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/release/package-windows.ps1

  - name: publish-release
    image: *shell
    depends_on:
      - package-windows
    environment:
      GITHUB_RELEASE_TOKEN:
        from_secret: GITHUB_RELEASE_TOKEN
    commands:
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/release/publish-release.ps1 -Tag "$env:CI_COMMIT_TAG"
