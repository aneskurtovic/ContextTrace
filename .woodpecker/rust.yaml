# Rust gates that do not need Windows.
#
# Portable Rust checks exclude the desktop crate, whose GTK/WebKitGTK
# dependencies are handled by the separate linux-desktop workflow.
# `cargo fmt` still covers the full workspace.

# An absent labels stanza is a wildcard, including on the local backend.
labels:
  platform: linux/amd64
  backend: docker

when:
  - event: [push, pull_request, manual]
    evaluate: 'RELEASE_UPLOAD != "true"'

variables:
  - &rust_image rust:1.97-bookworm
  - &cargo_env
    CARGO_TERM_COLOR: always
    # Incremental output is never reused: the workspace is discarded after the
    # pipeline. Writing it is pure cost.
    CARGO_INCREMENTAL: "0"

steps:
  - name: format
    image: *rust_image
    environment: *cargo_env
    commands:
      # The official images ship the minimal profile, and `rust-toolchain.toml`
      # asks for these two components by name.
      - rustup component add rustfmt
      # `--all`, with no `--exclude`: this is the one step that sees ct-ui.
      - cargo fmt --all -- --check

  - name: clippy
    image: *rust_image
    environment: *cargo_env
    commands:
      - rustup component add clippy
      - cargo clippy --workspace --exclude ct-ui --all-targets -- -D warnings

  - name: test
    image: *rust_image
    environment: *cargo_env
    commands:
      # Reuses the target directory clippy just populated, through the workspace
      # the steps of one workflow share.
      - cargo test --workspace --exclude ct-ui --all-targets

  - name: msrv
    image: *rust_image
    environment: *cargo_env
    commands:
      # `rust-toolchain.toml` pins the channel to stable, so name the toolchain
      # explicitly or this lane silently retests stable and proves nothing.
      - rustup toolchain install 1.88.0 --profile minimal
      - cargo +1.88.0 check --workspace --exclude ct-ui --all-targets
