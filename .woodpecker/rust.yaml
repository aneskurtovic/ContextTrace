# Rust gates that do not need Windows.
#
# Until this file existed, nothing had ever compiled this workspace off Windows
# -- `rust-toolchain.toml` said so in a comment. It turned out to build, lint,
# test and pass its MSRV check on Linux unchanged, because nothing these gates
# compile is platform-conditional: the one `#[cfg(windows)]` mention in
# `ct-adapters/src/archive.rs` is a comment explaining that the archive root is
# resolved *without* one. The real ones live in `ct-ui`, which every compiling
# step below excludes anyway -- Windows toast delivery is genuinely a Windows
# path, and the Windows workflow is where it gets compiled and tested.
#
# So these gates move off the single Windows agent, where they were competing
# for one machine, and the Windows workflow keeps only what Windows alone can
# prove. See docs/CI.md.
#
# `ct-ui` is excluded from every compiling step here: the Tauri crate needs
# webkit2gtk/gtk3/libsoup on Linux, and chasing that would buy a second way to
# build a desktop app that only ships for Windows. `cargo fmt` still covers it,
# because formatting does not compile.

# An ABSENT labels stanza is a wildcard, not a default -- Woodpecker will place
# the workflow on whichever agent has capacity. That is indistinguishable from
# correct while only one agent exists, and becomes a coin flip as soon as a
# second one registers. The `rust:1.97-bookworm` image below does not pin this
# to Linux either: on the `local` backend `image:` names a shell, not a
# container. Say what this workflow actually requires.
labels:
  platform: linux/amd64
  backend: docker

when:
  - event: [push, pull_request, manual]

variables:
  - &rust_image rust:1.97-bookworm
  - &cargo_env
    CARGO_TERM_COLOR: always
    # Incremental output is never reused: the workspace is discarded after the
    # pipeline. Writing it is pure cost.
    CARGO_INCREMENTAL: "0"

steps:
  - name: format
    image: *rust_image
    environment: *cargo_env
    commands:
      # The official images ship the minimal profile, and `rust-toolchain.toml`
      # asks for these two components by name.
      - rustup component add rustfmt
      # `--all`, with no `--exclude`: this is the one step that sees ct-ui.
      - cargo fmt --all -- --check

  - name: clippy
    image: *rust_image
    environment: *cargo_env
    commands:
      - rustup component add clippy
      - cargo clippy --workspace --exclude ct-ui --all-targets -- -D warnings

  - name: test
    image: *rust_image
    environment: *cargo_env
    commands:
      # Reuses the target directory clippy just populated, through the workspace
      # the steps of one workflow share.
      - cargo test --workspace --exclude ct-ui --all-targets

  - name: msrv
    image: *rust_image
    environment: *cargo_env
    commands:
      # `rust-toolchain.toml` pins the channel to stable, so name the toolchain
      # explicitly or this lane silently retests stable and proves nothing.
      - rustup toolchain install 1.88.0 --profile minimal
      - cargo +1.88.0 check --workspace --exclude ct-ui --all-targets
