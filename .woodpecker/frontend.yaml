# Frontend checks run on Linux; native desktop checks run separately.
# Explicit labels prevent scheduling onto the Windows local agent.
labels:
  platform: linux/amd64
  backend: docker

when:
  - event: [push, pull_request, manual]
    evaluate: 'RELEASE_UPLOAD != "true"'

variables:
  # Meet the Node version minimum in package.json.
  - &node_image node:22-bookworm-slim

steps:
  - name: install
    image: *node_image
    directory: crates/ct-ui
    commands:
      # `npm ci`, never `npm install`: the lockfile is the point.
      - npm ci

  - name: test
    image: *node_image
    directory: crates/ct-ui
    commands:
      # node_modules survives from the previous step through the shared
      # workspace, so this does not reinstall.
      - npm test

  - name: build
    image: *node_image
    directory: crates/ct-ui
    commands:
      - npm run build
