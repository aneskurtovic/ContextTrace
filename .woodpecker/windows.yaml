# Native Windows workspace, desktop, and CLI smoke validation.
# The local backend runs on the host without container isolation; never run
# untrusted pull-request code on this agent. Push validation runs on main and
# release packaging runs separately after trusted version tags.
when:
  - event: [push, manual]
    branch: main
    evaluate: 'RELEASE_UPLOAD != "true"'

labels:
  platform: windows/amd64
  backend: local

variables:
  # On the local backend `image` names the shell, not a container.
  - &shell powershell
  - &windows_env
    # Tauri parses CI as a boolean; Woodpecker defaults it to "woodpecker".
    CI: "true"
    CARGO_TERM_COLOR: always
    CARGO_INCREMENTAL: "0"
    # Reuse fingerprinted build output; incremental compilation stays off.
    # The agent runs one workflow at a time.
    CARGO_TARGET_DIR: C:/woodpecker-cache/contexttrace/target
    npm_config_cache: C:/woodpecker-cache/contexttrace/npm

steps:
  - name: release-notes
    image: *shell
    environment: *windows_env
    commands:
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/release/test-release-notes.ps1

  - name: clippy
    image: *shell
    environment: *windows_env
    commands:
      # No --exclude: this is the only lint pass that sees the Tauri crate.
      - cargo clippy --workspace --all-targets -- -D warnings

  - name: test
    image: *shell
    environment: *windows_env
    commands:
      - cargo test --workspace --all-targets

  # The local backend ignores `directory:`; paths are relative to the root.
  - name: frontend-dependencies
    image: *shell
    environment: *windows_env
    commands:
      - npm ci --prefix crates/ct-ui

  - name: release-asset-names
    image: *shell
    environment: *windows_env
    commands:
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/release/test-asset-names.ps1

  - name: release-asset-tests
    image: *shell
    environment: *windows_env
    commands:
      - node --test scripts/release/release-assets.test.cjs

  - name: desktop
    image: *shell
    environment: *windows_env
    commands:
      # Bundling and signing belong to the release pipeline. This still runs
      # Tauri's production frontend build and compiles the Windows desktop app.
      # tauri resolves its config relative to the process directory, so this one
      # genuinely has to change directory rather than pass a prefix.
      - Set-Location crates/ct-ui; ./node_modules/.bin/tauri.cmd build --no-bundle

  - name: cli-release
    image: *shell
    environment: *windows_env
    commands:
      - cargo build --release -p ct-cli

  # Each smoke runs as its own `powershell -File` process on purpose.
  #
  # Dot-running the script instead would hand a mid-script `throw` back to the
  # wrapper Woodpecker generates for a step, and whether that wrapper turns a
  # terminating error into a failed step is not something this project has
  # measured. A child process has one exit code and no ambiguity -- which
  # matters here more than anywhere else in the pipeline, because these are the
  # assertions that no credential survives a redacted export or reaches the
  # archive. A check of that kind reporting a false green is worse than no check.
  - name: smoke-cli
    image: *shell
    environment: *windows_env
    commands:
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/ci/smoke-cli.ps1

  - name: smoke-secrets
    image: *shell
    environment: *windows_env
    commands:
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/ci/smoke-secrets.ps1

  - name: smoke-archive
    image: *shell
    environment: *windows_env
    commands:
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/ci/smoke-archive.ps1
