[workspace]
resolver = "2"
members = [
    "crates/ct-domain",
    "crates/ct-application",
    "crates/ct-adapters",
    "crates/ct-runtime",
    "crates/ct-cli",
    "crates/ct-ui/src-tauri",
]

# Domain ports separate use cases from concrete adapters. The runtime composes
# those layers for the CLI and desktop application.

[workspace.package]
version = "0.1.17"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/aneskurtovic/ContextTrace"

[workspace.dependencies]
ct-domain = { path = "crates/ct-domain" }
ct-application = { path = "crates/ct-application" }
ct-adapters = { path = "crates/ct-adapters" }
ct-runtime = { path = "crates/ct-runtime" }

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# Keep chrono default clock and platform timezone features disabled.
chrono = { version = "0.4", default-features = false, features = ["serde", "std", "alloc"] }
thiserror = "2"
anyhow = "1"
# Enable only the clap features used by the CLI.
clap = { version = "4", default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
    "error-context",
] }
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }

[workspace.lints.clippy]
# Descending sorts are written `b.cmp(&a)` throughout, which reads as what it is.
# The suggested `sort_by_key(|x| Reverse(...))` is not clearer, and does not
# compile unchanged where the key borrows from the element.
unnecessary_sort_by = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
