[package]
name = "ct-ui"
description = "ContextTrace local-first desktop application."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "ct_ui"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "context-trace"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
ct-domain.workspace = true
ct-application.workspace = true
ct-runtime.workspace = true
serde.workspace = true
# Already in this crate's compiled graph twice over -- `tauri` serializes every
# command's return value with it, and `ct-adapters` parses session logs with it
# -- so naming it directly adds an edge, not a crate. `ct export` is the one
# path where this UI must produce bytes itself rather than hand a value to
# Tauri's IPC layer, and the alternative was re-implementing `ExportRecord`'s
# wire shape in a file that does not own it, under a schema version that
# promises it will not drift.
serde_json.workspace = true
base64 = "0.22"
chrono.workspace = true
tauri = { version = "2.11.5", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
# Pin versions that retain the workspace Rust 1.88 minimum.
tauri-plugin-opener = "=2.5.3"
tauri-plugin-deep-link = "=2.4.7"
# A second instance polls the same logs and writes the same notification store
# as the first, with no cross-process locking between them. There is no use for
# two, so there is one.
tauri-plugin-single-instance = "2"

# WinRT is already in the notification dependency graph. Direct XML enables
# protocol activation for clicks after process exit while retaining synchronous
# delivery errors. Keep it Windows-only.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Data_Xml_Dom", "UI_Notifications"] }

[dev-dependencies]
ct-adapters.workspace = true

[lints]
workspace = true
