[package]
name = "ct-ui"
description = "ContextTrace local-first desktop application."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "ct_ui"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "context-trace"
path = "src/main.rs"

[features]
# Set only by the signed macOS release build; development bundles cannot update.
macos-updater = []
# Enabled only for signed AppImage releases.
linux-updater = []

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
ct-domain.workspace = true
ct-application.workspace = true
ct-runtime.workspace = true
serde.workspace = true
# Desktop exports serialize the shared export record format.
serde_json.workspace = true
base64 = "0.22"
chrono.workspace = true
tauri = { version = "2.11.5", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
# Pin versions that retain the workspace Rust 1.88 minimum.
tauri-plugin-opener = "=2.5.3"
tauri-plugin-deep-link = "=2.4.7"
# Prevent concurrent instances from writing the notification store.
tauri-plugin-single-instance = "2"

# WinRT is already in the notification dependency graph. Direct XML enables
# protocol activation for clicks after process exit while retaining synchronous
# delivery errors. Keep it Windows-only.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Data_Xml_Dom", "UI_Notifications"] }

# Use the plugin's existing native backend directly so send errors are retained.
[target.'cfg(target_os = "macos")'.dependencies]
notify-rust = { version = "4.18.0", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4.18.0"

[dev-dependencies]
ct-adapters.workspace = true
flate2 = "1"
tar = "0.4"
tempfile = "3"

[lints]
workspace = true
