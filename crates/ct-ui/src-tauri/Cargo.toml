[package]
name = "ct-ui"
description = "ContextTrace local-first desktop application."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "ct_ui"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "context-trace"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
ct-domain.workspace = true
ct-application.workspace = true
ct-runtime.workspace = true
serde.workspace = true
# Already in this crate's compiled graph twice over -- `tauri` serializes every
# command's return value with it, and `ct-adapters` parses session logs with it
# -- so naming it directly adds an edge, not a crate. `ct export` is the one
# path where this UI must produce bytes itself rather than hand a value to
# Tauri's IPC layer, and the alternative was re-implementing `ExportRecord`'s
# wire shape in a file that does not own it, under a schema version that
# promises it will not drift.
serde_json.workspace = true
chrono.workspace = true
tauri = { version = "2.11.5", features = [] }
tauri-plugin-notification = "2"
# A second instance polls the same logs and writes the same notification store
# as the first, with no cross-process locking between them. There is no use for
# two, so there is one.
tauri-plugin-single-instance = "2"

# The toast API `tauri-plugin-notification` already builds on, named directly
# because the plugin's own `show()` spawns the send and discards its `Result`.
# That made every recorded delivery an assumption; calling this synchronously is
# what lets the desktop report what Windows actually said. Already in the
# compiled graph beneath the plugin, so this adds an edge, not a crate. Target
# scoped because it is the Windows delivery path and nothing else.
[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.7.3"

[dev-dependencies]
ct-adapters.workspace = true

[lints]
workspace = true
